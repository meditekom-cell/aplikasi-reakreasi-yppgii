<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background rounded square gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Sun gradient -->
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Compass needle gradient -->
    <linearGradient id="needleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <!-- Subtle inner glow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Base Icon Container (Rounded Squircle) -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" />
  
  <!-- Subtle inner border for crispness on dark and light browser tabs -->
  <rect x="2.5" y="2.5" width="59" height="59" rx="15.5" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1" />

  <!-- Tropical Sun (Pangandaran Sunrise/Sunset) -->
  <circle cx="44" cy="20" r="8" fill="url(#sunGrad)" filter="url(#shadow)" />
  
  <!-- Ocean Waves (Pangandaran Coast) -->
  <path d="M 6 45 Q 18 39 30 45 T 58 45 L 58 56 Q 46 60 32 60 Q 18 60 6 56 Z" fill="#0369a1" opacity="0.45" />
  <path d="M 4 48 Q 17 42 32 48 T 60 48 L 60 58 Q 48 62 32 62 Q 16 62 4 58 Z" fill="#082f49" opacity="0.35" />

  <!-- Gathering & Expedition Compass Icon -->
  <g filter="url(#shadow)">
    <!-- Outer Ring -->
    <circle cx="28" cy="32" r="17" fill="#0f172a" fill-opacity="0.2" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
    
    <!-- Compass Marks (N, S, E, W) -->
    <line x1="28" y1="12" x2="28" y2="15" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
    <line x1="28" y1="49" x2="28" y2="52" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
    <line x1="9.5" y1="32" x2="12.5" y2="32" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
    <line x1="43.5" y1="32" x2="46.5" y2="32" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />

    <!-- North Arrow (Red/Orange Accent) -->
    <polygon points="28,17 33,31 28,28" fill="#f43f5e" />
    <polygon points="28,17 23,31 28,28" fill="#e11d48" />

    <!-- South Arrow (White Accent) -->
    <polygon points="28,47 33,33 28,36" fill="url(#needleGrad)" />
    <polygon points="28,47 23,33 28,36" fill="#cbd5e1" />

    <!-- Center Pivot Pin -->
    <circle cx="28" cy="32" r="2.5" fill="#f8fafc" stroke="#0284c7" stroke-width="1.2" />
  </g>
</svg>
